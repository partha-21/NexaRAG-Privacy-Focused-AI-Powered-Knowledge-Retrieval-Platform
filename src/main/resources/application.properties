server.port=8080

# Where your documents live, and where the persisted index is stored
rag.docs-dir=docs
rag.data-dir=data

# Local LLM served by Ollama
rag.ollama-url=http://localhost:11434
rag.model=llama3.2

# Chunking
rag.chunk-size=500
rag.chunk-overlap=50

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Authentication
# Set to false after you have created your account to stop anyone else from registering
rag.allow-registration=true
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# When serving over HTTPS, also set: server.servlet.session.cookie.secure=true
